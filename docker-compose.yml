# รันทดลองในเครื่อง: docker compose --env-file .env up --build
# แล้วเปิด http://localhost:8080 (ต้องมี .env ที่ใส่ค่า GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET ดู .env.example)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taxbook
      POSTGRES_USER: taxbook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ตั้ง DB_PASSWORD ใน .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxbook -d taxbook"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/taxbook
      DB_USER: taxbook
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
volumes:
  pgdata:
